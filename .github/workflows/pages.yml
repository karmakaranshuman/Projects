name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nextiva/Chatbot Builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Nextiva/Chatbot Builder/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Assemble site
        working-directory: .
        run: |
          mkdir -p _site/nextiva
          cp -R "Nextiva/Chatbot Builder/dist" _site/nextiva/chatbotbuilder
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <title>projects/nextiva/chatbotbuilder</title>
          <p><a href="nextiva/chatbotbuilder/">projects/nextiva/chatbotbuilder</a></p>
          HTML
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
